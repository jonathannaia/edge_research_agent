name: DART smoke test

# Manual-only verification for src/providers/live_dart.py against the real
# DART API — not scheduled, no ongoing cost. Trigger from the Actions tab
# any time you want to confirm the Korea filings/fundamentals integration
# is still working (e.g. after DART changes something, or just to sanity
# check a fresh EDGE_DART_API_KEY).
on:
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DART smoke test
        env:
          EDGE_DART_API_KEY: ${{ secrets.EDGE_DART_API_KEY }}
        run: python -m scripts.dart_smoke_test
