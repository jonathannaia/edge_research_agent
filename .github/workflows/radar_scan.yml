name: Radar scan

on:
  schedule:
    # Every 2 hours. GitHub Actions cron is UTC and best-effort (can run a
    # few minutes late under load) — that's fine for a ~12-scans/day cadence.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit updated data/radar_*.json back to the repo

concurrency:
  group: radar-scan
  cancel-in-progress: false  # never cancel a run that might be mid-commit

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Radar scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional — a Slack/Discord/Mattermost incoming webhook URL. Leave
          # this repo secret unset and notifications simply don't fire; see
          # README "Radar" section and src/radar/notifier.py for what it does
          # (and importantly, does NOT do — it's not filtered to your
          # Watchlist, since this job can't see your local database).
          EDGE_RADAR_WEBHOOK_URL: ${{ secrets.EDGE_RADAR_WEBHOOK_URL }}
          # Optional — used by src/radar/snapshots.py for the automated
          # price/valuation snapshot of verified/tracked tickers. Leave
          # unset and that piece just no-ops (price/valuation stay null in
          # data/ticker_snapshots.json); insider transactions and news
          # (SEC EDGAR, keyless) still refresh regardless.
          EDGE_FINNHUB_API_KEY: ${{ secrets.EDGE_FINNHUB_API_KEY }}
        run: python -m scripts.run_radar_scan

      - name: Commit updated findings
        run: |
          git config user.name "eeva-radar-bot"
          git config user.email "actions@github.com"
          git add data/radar_findings.json data/radar_state.json data/ticker_snapshots.json
          git diff --cached --quiet || git commit -m "Radar scan: update findings [skip ci]"
          git push
