name: Finnhub smoke test

# Manual-only diagnostic — dumps raw real Finnhub API responses so field
# names can be confirmed before src/providers/live_price.py trusts them.
# Not scheduled, no ongoing cost.
on:
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Finnhub smoke test
        env:
          EDGE_FINNHUB_API_KEY: ${{ secrets.EDGE_FINNHUB_API_KEY }}
        run: python -m scripts.finnhub_smoke_test
