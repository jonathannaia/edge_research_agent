[theme]
base = "dark"

primaryColor = "#38BDF8"
backgroundColor = "#070B14"
secondaryBackgroundColor = "#0D1424"
textColor = "#F8FAFC"

linkColor = "#38BDF8"
linkUnderline = false

borderColor = "#26334A"
dataframeBorderColor = "#26334A"
dataframeHeaderBackgroundColor = "#0D1424"

codeTextColor = "#38BDF8"
codeBackgroundColor = "#0D1424"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 16
headingFontWeights = [700, 600, 600, 600, 600, 600]

baseRadius = "small"
buttonRadius = "small"

showWidgetBorder = true
showSidebarBorder = true

[server]
headless = true

[browser]
gatherUsageStats = false
