[theme]
base = "dark"

primaryColor = "#C7D6E3"
backgroundColor = "#050505"
secondaryBackgroundColor = "#0B0B0B"
textColor = "#F5F5F5"

linkColor = "#C7D6E3"
linkUnderline = false

borderColor = "#2F3336"
dataframeBorderColor = "#2F3336"
dataframeHeaderBackgroundColor = "#0B0B0B"

codeTextColor = "#C7D6E3"
codeBackgroundColor = "#0B0B0B"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 16
headingFontWeights = [700, 600, 600, 600, 600, 600]

baseRadius = "small"
buttonRadius = "small"

showWidgetBorder = true
showSidebarBorder = true

[server]
headless = true

[browser]
gatherUsageStats = false
